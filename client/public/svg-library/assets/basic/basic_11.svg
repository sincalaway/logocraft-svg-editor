<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 width="100px" height="100px" viewBox="0 0 100 100" enable-background="new 0 0 100 100" xml:space="preserve" shapeType="right triangle">
	 <linearGradient class="linearGradient" x1="0%" y1="0%" x2="0%" y2="100%" gradientTransform="translate(0.5,0.5) rotate(0) translate(-0.5,-0.5)">
		<stop id="stop1" offset="0%" class="linearGradientColor1" stop-color="#05a" />
		<stop id="stop2" offset="100%" class="linearGradientColor2" stop-color="#0a5"/>
	</linearGradient>

	<radialGradient class="radialGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
		<stop offset="0%" class="radialGradientColor1" stop-color="#05a"/>
		<stop offset="100%" class="radialGradientColor2" stop-color="#0a5"/>
	</radialGradient>
	<clipPath id="f_right_triangle" class="clipPath">
		<polygon class="element" fill="none" stroke="#dddddd" stroke-width="1" stroke-miterlimit="10" points="0,0 0,100 100,100"/>
	</clipPath>
	<polygon fill="#343C49" opacity="1" class="fill-color element" points="0 1 0 100 99 100" clip-path="url(#f_right_triangle)"/>
	<polygon class="stroke-color element" fill="none" stroke="#dddddd" stroke-width="0" stroke-miterlimit="10" points="0,0 0,100 100,100"
	clip-path="url(#f_right_triangle)"/>
</svg>